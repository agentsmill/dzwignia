<style>
html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
:root {
  color-scheme: light;
  --bg: #E8ECF0;
  --bg-deep: #DCE2E8;
  --panel: #FFFFFF;
  --panel-2: #F4F6F9;
  --ink: #0E1822;
  --ink-2: #2F3E4C;
  --muted: #5C6B79;
  --line: #CBD4DD;
  --line-2: #E2E7EC;
  --accent: #2437D9;
  --accent-2: #1A2AB0;
  --accent-soft: #E3E6FB;
  --accent-ink: #FFFFFF;
  --signal: #F2A100;
  --signal-soft: #FFF1CF;
  --up: #0A8A58;
  --up-soft: #DDF3E9;
  --down: #C23428;
  --down-soft: #FBE3E0;
  --warn: #A96300;
  --warn-soft: #FDEBD0;
  --t-wiedza: #5B3CC4;
  --t-skill: #2437D9;
  --t-automat: #00766A;
  --t-pilot: #B85500;
  --t-ochrona: #445866;
  --t-ludzie: #A82C68;
  --t-platforma: #16255F;
  --t-polityka: #56620A;
  --t-ink: #FFFFFF;
  --d-sprzedaz: #BC4A2A;
  --d-trading: #1D66C4;
  --d-finanse: #23845A;
  --d-compliance: #7447C2;
  --d-ryzyko: #A87A00;
  --d-operacje: #0B8585;
  --shadow: 0 1px 1px rgba(14, 24, 34, .04), 0 6px 20px -8px rgba(14, 24, 34, .18);
  --radius: 10px;
  --f-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0A1016; --bg-deep: #060B10; --panel: #111A23; --panel-2: #16212C;
    --ink: #E3EAF0; --ink-2: #BAC6D1; --muted: #8696A5; --line: #253341; --line-2: #1B2733;
    --accent: #8390FF; --accent-2: #A3ADFF; --accent-soft: #1C2350; --accent-ink: #0A1016;
    --signal: #FFB62E; --signal-soft: #3A2A07;
    --up: #3DCB8E; --up-soft: #0E2C20; --down: #FF6E61; --down-soft: #3A1512; --warn: #FFB547; --warn-soft: #3A2708;
    --t-wiedza: #A887FF; --t-skill: #8390FF; --t-automat: #3CC8BA; --t-pilot: #FF9A45; --t-ochrona: #9AB0C2; --t-ludzie: #FF74AE; --t-platforma: #93A6FF; --t-polityka: #BCCB5C; --t-ink: #0A1016;
    --d-sprzedaz: #FF8A66; --d-trading: #6EA8FF; --d-finanse: #54D193; --d-compliance: #B592FF; --d-ryzyko: #E8B93C; --d-operacje: #45CFCF;
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 24px -10px rgba(0, 0, 0, .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A1016; --bg-deep: #060B10; --panel: #111A23; --panel-2: #16212C;
  --ink: #E3EAF0; --ink-2: #BAC6D1; --muted: #8696A5; --line: #253341; --line-2: #1B2733;
  --accent: #8390FF; --accent-2: #A3ADFF; --accent-soft: #1C2350; --accent-ink: #0A1016;
  --signal: #FFB62E; --signal-soft: #3A2A07;
  --up: #3DCB8E; --up-soft: #0E2C20; --down: #FF6E61; --down-soft: #3A1512; --warn: #FFB547; --warn-soft: #3A2708;
  --t-wiedza: #A887FF; --t-skill: #8390FF; --t-automat: #3CC8BA; --t-pilot: #FF9A45; --t-ochrona: #9AB0C2; --t-ludzie: #FF74AE; --t-platforma: #93A6FF; --t-polityka: #BCCB5C; --t-ink: #0A1016;
  --d-sprzedaz: #FF8A66; --d-trading: #6EA8FF; --d-finanse: #54D193; --d-compliance: #B592FF; --d-ryzyko: #E8B93C; --d-operacje: #45CFCF;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 8px 24px -10px rgba(0, 0, 0, .7);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-body); font-size: 15.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--f-mono); font-size: .86em; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
[hidden] { display: none !important; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* ---------- przyciski ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 9px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 14.5px; cursor: pointer; text-align: center; line-height: 1.25; transition: background .15s, border-color .15s, transform .08s; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover:not(:disabled) { background: var(--accent-2); border-color: var(--accent-2); }
.btn-big { min-height: 52px; padding: 12px 22px; font-size: 16px; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 8px; }
.btn-ghost:hover:not(:disabled) { border-color: transparent; text-decoration: underline; }
.btn-sm { min-height: 34px; padding: 6px 11px; font-size: 13px; border-radius: 7px; }
.btn-warn { border-color: var(--down); color: var(--down); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- układ ---------- */
#app { min-height: 100%; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 20px; }
.shell { max-width: 1280px; margin: 0 auto; padding: 20px 20px 96px; display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 22px; align-items: start; }
.shell.full { grid-template-columns: minmax(0, 1fr); }
#side { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); max-height: calc(100vh - 110px); overflow: auto; scrollbar-width: thin; }
.shell.full #side { display: none; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.p-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.p-head h3 { font-family: var(--f-display); font-stretch: 112%; font-size: 17px; font-weight: 750; }

/* ---------- pasek terminala ---------- */
#term { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.term-in { max-width: 1280px; margin: 0 auto; padding: 10px 20px; display: grid; grid-template-columns: auto auto repeat(5, minmax(0, 1fr)); gap: 0; align-items: stretch; }
.t-cell { padding: 2px 16px; border-left: 1px solid var(--line-2); display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.t-cell:first-child { border-left: 0; padding-left: 0; }
.t-cell b { font-family: var(--f-mono); font-size: 17px; font-weight: 600; letter-spacing: -.03em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-cell b.neg { color: var(--down); }
.t-id { gap: 3px; }
.t-logo { font-family: var(--f-display); font-stretch: 125%; font-weight: 850; font-size: 16px; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; }
.t-logo i { font-style: normal; color: var(--signal); }
.t-who { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-q b { font-family: var(--f-display); font-stretch: 118%; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.gauge { position: relative; height: 6px; background: var(--line-2); border-radius: 3px; margin-top: 5px; overflow: hidden; }
.gauge i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--up); transition: width .4s ease; }
.gauge.warn i { background: var(--signal); }
.gauge.bad i { background: var(--down); }
.gauge.none i { background: var(--line); }
.gauge em { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-2); opacity: .55; }
.t-sub { font-size: 10.5px; color: var(--muted); margin-top: 3px; font-family: var(--f-mono); letter-spacing: -.02em; line-height: 1.3; }
.dots { display: inline-flex; gap: 4px; align-items: center; height: 22px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.dots i.on { background: var(--accent); }
.term-alert { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; font-weight: 600; text-align: center; padding: 5px 20px; border-top: 1px solid var(--line-2); }
.term-alert.bad { background: var(--down-soft); color: var(--down); }

/* ---------- podziały pionów ---------- */
.dv { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 650; color: var(--ink-2); white-space: nowrap; }
.dv::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--dc, var(--muted)); flex: none; }
.dv-sprzedaz { --dc: var(--d-sprzedaz); } .dv-trading { --dc: var(--d-trading); } .dv-finanse { --dc: var(--d-finanse); }
.dv-compliance { --dc: var(--d-compliance); } .dv-ryzyko { --dc: var(--d-ryzyko); } .dv-operacje { --dc: var(--d-operacje); }

/* ---------- start ---------- */
.hero { padding: 44px 0 26px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: end; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
.h-title { font-family: var(--f-display); font-stretch: 125%; font-weight: 900; font-size: clamp(52px, 10vw, 118px); line-height: .86; letter-spacing: -.035em; }
.h-title span { display: block; color: var(--accent); }
.h-title span b { font-weight: 900; color: var(--signal); }
.lead { font-size: 18px; line-height: 1.5; color: var(--ink-2); margin-top: 18px; max-width: 34em; }
.riskbox { border: 1.5px solid var(--ink); border-radius: 4px; padding: 14px 16px; background: var(--panel); font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.riskbox .lbl { color: var(--ink); margin-bottom: 6px; display: block; font-weight: 700; }
.riskbox p + p { margin-top: 6px; }
.riskbox a { font-size: 12px; }
.setup { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); }
.setup h2 { font-family: var(--f-display); font-stretch: 115%; font-weight: 800; font-size: 22px; }
.field { display: grid; gap: 6px; max-width: 420px; }
.field input, .m-card input, .m-card textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--panel-2); font-size: 16px; }
.field input:focus, .m-card input:focus, .m-card textarea:focus { outline: none; border-color: var(--accent); background: var(--panel); }
.divgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.divpick { text-align: left; padding: 14px 14px 13px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--panel-2); cursor: pointer; display: grid; gap: 5px; align-content: start; position: relative; }
.divpick:hover { border-color: var(--ink-2); }
.divpick[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.divpick b { font-family: var(--f-display); font-stretch: 110%; font-size: 15.5px; font-weight: 750; }
.divpick small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.divpick .perk { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; }
.start-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.start-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.start-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; padding-bottom: 60px; }
.ticker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ticker > div { background: var(--panel); padding: 12px 14px; display: grid; gap: 2px; }
.ticker b { font-family: var(--f-mono); font-size: 20px; font-weight: 600; letter-spacing: -.03em; }
.howto ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.howto li::marker { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.gate { padding-block: 48px 80px; display: grid; gap: 22px; }
.gate-card { max-width: 540px; }
.gate-err { color: var(--down); font-weight: 650; font-size: 14.5px; }
.resume { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 8px; background: var(--signal-soft); border: 1px solid var(--signal); font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); padding: 18px 0 40px; border-top: 1px solid var(--line); }

/* ---------- etapy kwartału ---------- */
.stepper { display: flex; gap: 0; margin-bottom: 16px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.stepper div { flex: 1; padding: 8px 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line-2); display: flex; gap: 7px; align-items: center; white-space: nowrap; overflow: hidden; }
.stepper div:first-child { border-left: 0; }
.stepper div.done { color: var(--ink-2); }
.stepper div.done::before { content: "✓"; color: var(--up); font-weight: 700; }
.stepper div.now { background: var(--ink); color: var(--panel); }
.stepper div.now::before { content: "▸"; }
.stage { display: grid; gap: 16px; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
.sheet h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: clamp(22px, 3vw, 29px); line-height: 1.12; letter-spacing: -.01em; margin: 6px 0 12px; }
.sheet .body { font-size: 16.5px; line-height: 1.6; color: var(--ink-2); max-width: 44em; }
.news { border-top: 4px solid var(--ink); }
.news .meta { display: flex; gap: 10px; align-items: center; }
.news .meta .tag { background: var(--ink); color: var(--panel); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; padding: 3px 7px; border-radius: 3px; }
.effect { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-2); display: grid; gap: 8px; font-size: 14.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.chip.up { background: var(--up-soft); border-color: transparent; color: var(--up); }
.chip.down { background: var(--down-soft); border-color: transparent; color: var(--down); }
.stage-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

/* decyzja */
.dilemma { border-top: 4px solid var(--accent); }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; font-size: 15.5px; line-height: 1.45; font-weight: 550; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 700; font-size: 13px; background: var(--panel-2); border: 1px solid var(--line); }
.opt:disabled { cursor: default; opacity: .5; }
.opt.chosen { opacity: 1; border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt.chosen .k { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.opt.best { opacity: 1; }
.opt.best .k { background: var(--up); color: #fff; border-color: var(--up); }
.outcome { margin-top: 16px; display: grid; gap: 10px; padding: 14px 16px; border-radius: 9px; background: var(--panel-2); border-left: 4px solid var(--ink); }
.outcome.good { border-left-color: var(--up); }
.outcome p { font-size: 15.5px; }
.lesson { margin-top: 14px; padding: 16px 18px; border-radius: 9px; background: var(--signal-soft); border: 1px solid var(--signal); display: grid; gap: 6px; }
.lesson .lbl { color: var(--warn); font-weight: 700; }
.lesson p { font-size: 15px; line-height: 1.55; color: var(--ink); }
.lesson .verdict { font-weight: 700; font-size: 14px; }

/* portfel */
.pf-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.pf-head h2 { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 26px; }
.pf-cap { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); }
.pf-cap .dots i { width: 14px; height: 14px; }
.pf-cap { flex-wrap: wrap; }
.pf-ml { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 5px; background: var(--up-soft); color: var(--up); white-space: nowrap; }
.pf-ml.warn { background: var(--warn-soft); color: var(--warn); } .pf-ml.bad { background: var(--down-soft); color: var(--down); }
.callout { padding: 12px 14px; border-radius: 9px; background: var(--signal-soft); border: 1px solid var(--signal); font-size: 14.5px; display: grid; gap: 4px; }
.callout .lbl { color: var(--warn); font-weight: 700; }
.offer { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.c-band { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--tc); color: var(--t-ink); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; }
.c-body { padding: 13px 14px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.c-body h4 { font-family: var(--f-display); font-stretch: 106%; font-size: 17px; font-weight: 750; line-height: 1.2; }
.c-body p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
.c-stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.c-stats li { display: flex; gap: 7px; }

/* ---------- narzędzia ---------- */
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function round1(v) { return Math.round(v * 10) / 10; }
function str(s, n) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, n); }
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rngFor(G, salt) { return mulberry32(hashStr(G.run + '|' + G.q + '|' + salt)); }
function shuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uid(p) { return (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function kLevel(notes, schema) { let k = 0; CFG.kThresholds.forEach(t => { if (notes >= t) k++; }); return schema ? k : Math.min(k, 1); }

/* ============================================================
   Świat firmy: składany ze wszystkich zdarzeń w pokoju
   ============================================================ */
function foldWorld(events) {
  const W = {
    players: {}, notes: [], noteCount: 0, schema: null, staleness: 0, lastLint: null,
    platform: {}, policies: {}, skills: {}, installs: [], requests: [], incidents: [], helps: [],
    trustSum: 0, feed: [], evCount: 0
  };
  const seen = new Set();
  const player = e => {
    let p = W.players[e.player];
    if (!p) p = W.players[e.player] = { id: e.player, name: e.name, div: e.division, runs: {}, c: { note: 0, schema: 0, lint: 0, skill: 0, install: 0, request: 0, platform: 0, policy: 0, help: 0 }, last: e.ts };
    p.name = e.name; p.div = e.division; p.last = e.ts;
    return p;
  };
  for (const e of events) {
    if (!e || !DIVS[e.division]) continue;
    const d = e.data || {};
    if (d.cid) { if (seen.has(d.cid)) continue; seen.add(d.cid); }
    W.evCount++;
    const p = player(e);
    const run = str(d.run, 40) || 'x';
    const R = () => p.runs[run] || (p.runs[run] = { run, div: e.division, q: 0, value: 0, done: false, ts: e.ts });
    const who = { pid: e.player, name: e.name, div: e.division, ts: e.ts };
    const feed = (kind, extra) => W.feed.push(Object.assign({ kind }, who, extra || {}));
    switch (e.type) {
      case 'start': R(); feed('start'); break;
      case 'q': { const r = R(); r.q = Math.max(r.q, +d.q || 0); r.value = +d.value || 0; r.lastTs = e.ts; break; }
      case 'end': { const r = R(); r.done = true; r.q = QUARTERS.length; r.value = +d.value || 0; r.profile = str(d.profile, 20); r.stats = d.stats || {}; feed('end', { value: r.value, profile: r.profile }); break; }
      case 'note': {
        const text = str(d.text, 140);
        W.notes.push(Object.assign({ text, kind: str(d.kind, 12) || 'ingest' }, who));
        W.noteCount += 1; W.staleness += 1; p.c.note++;
        if (text) feed('note', { text });
        break;
      }
      case 'schema':
        if (!W.schema) { W.schema = who; p.c.schema++; W.noteCount += 1; W.staleness += 1; feed('schema'); }
        break;
      case 'lint': if (W.staleness >= 3) p.c.lint++; W.staleness = 0; W.lastLint = who; feed('lint'); break;
      case 'skill': {
        const sid = d.sid; if (!SKILLS[sid]) break;
        const prev = W.skills[sid];
        const rules = prev ? prev.rules.slice() : [];
        const rule = str(d.rule, 140);
        if (rule) rules.push({ text: rule, by: e.name, div: e.division });
        W.skills[sid] = { sid, v: prev ? prev.v + 1 : 1, by: e.player, byName: e.name, byDiv: e.division, ts: e.ts, rules, installs: prev ? prev.installs : 0, improv: !!d.improv };
        p.c.skill++;
        for (const rq of W.requests) {
          if (rq.sid === sid && !rq.doneBy) { rq.doneBy = e.player; rq.doneName = e.name; if (rq.from !== e.player) p.c.request++; }
        }
        feed('skill', { sid, v: W.skills[sid].v });
        break;
      }
      case 'install': {
        const s = W.skills[d.sid]; if (!s) break;
        s.installs++;
        W.installs.push(Object.assign({ sid: d.sid, author: d.author }, who));
        const a = W.players[d.author];
        if (a && d.author !== e.player) a.c.install++;
        feed('install', { sid: d.sid, authorName: a ? a.name : '', authorDiv: a ? a.div : '' });
        break;
      }
      case 'request': {
        if (!SKILLS[d.sid] || W.skills[d.sid]) break;
        if (W.requests.some(r => r.from === e.player && r.sid === d.sid && !r.doneBy)) break;
        W.requests.push({ id: d.cid, sid: d.sid, to: SKILLS[d.sid].div, from: e.player, fromName: e.name, fromDiv: e.division, ts: e.ts, doneBy: null });
        feed('request', { sid: d.sid, to: SKILLS[d.sid].div });
        break;
      }
      case 'platform':
        if (PLATFORM[d.pid] && !W.platform[d.pid]) { W.platform[d.pid] = who; p.c.platform++; feed('platform', { pid: d.pid }); }
        break;
      case 'policy':
        if (POLICIES[d.pid] && !W.policies[d.pid]) { W.policies[d.pid] = who; p.c.policy++; W.trustSum += POLICIES[d.pid].trust; feed('policy', { pid: d.pid }); }
        break;
      case 'incident':
        W.incidents.push(Object.assign({ id: d.cid || uid('i'), title: str(d.title, 120), cost: +d.cost || 0 }, who));
        W.trustSum += CFG.incidentTrust;
        feed('incident', { title: str(d.title, 120) });
        break;
      case 'help':
        if (d.inc && !W.helps.some(h => h.pid === e.player && h.inc === d.inc)) {
          W.helps.push(Object.assign({ inc: d.inc }, who));
          W.trustSum += CFG.helpTrust; p.c.help++;
          const inc = W.incidents.find(i => i.id === d.inc);
          feed('help', { incName: inc ? inc.name : '', incDiv: inc ? inc.div : '' });
        }
        break;
      case 'trust': W.trustSum += clamp(+d.d || 0, -10, 10); break;
    }
  }
  W.trust = clamp(CFG.trust0 + W.trustSum, 0, 100);
  W.K = kLevel(W.noteCount, !!W.schema);
  W.debt = W.staleness >= CFG.staleLimit;
  W.allO = Object.keys(W.policies).reduce((s, k) => s + POLICIES[k].allO, 0);
  const w = CFG.wklad;
  for (const p of Object.values(W.players)) {
    const im = (DIVS[p.div] && DIVS[p.div].mods.installMult) || 1;
    p.wklad = p.c.note * w.note + p.c.schema * w.schema + p.c.lint * w.lint + p.c.skill * w.skill +
      Math.round(p.c.install * w.install * im) + p.c.request * w.request + p.c.platform * w.platform +
      p.c.policy * w.policy + p.c.help * w.help;
  }
  return W;
}

function trustState(W) {
  if (W.trust < 40) return { key: 'kontrola', label: 'Kontrola KNF', text: 'Każdy pion ma punkt mniej na kwartał, incydenty kosztują 1,5 raza więcej.' };
  if (W.trust < 60) return { key: 'nadzor', label: 'Nadzór wzmożony', text: 'Wdrożenie wymaga poziomu depozytu co najmniej 100% po wdrożeniu.' };
  return { key: 'ok', label: 'Stabilne', text: 'Nadzór nie ma zastrzeżeń.' };
}

function leaderboard(W) {
  const rows = [];
  for (const p of Object.values(W.players)) {
    const runs = Object.values(p.runs);
    if (!runs.length) continue;
    let best = null, live = null;
    for (const r of runs) {
      if (!r.done) { if (!live || (r.lastTs || r.ts) > (live.lastTs || live.ts)) live = r; }
      if (!best || r.value > best.value) best = r;
    }
    rows.push({ pid: p.id, name: p.name, div: p.div, best: best ? best.value : 0, bestRun: best, live, wklad: p.wklad || 0, score: Math.round((best ? best.value : 0) + (p.wklad || 0)), runs: runs.length, profile: best && best.profile });
  }
  rows.sort((a, b) => b.score - a.score);
  rows.forEach((r, i) => { r.place = i + 1; });
  return rows;
}

function openRequestsTo(div, W) { return W.requests.filter(r => r.to === div && !r.doneBy); }
function onceDone(W, key) {
  if (key === 'schema') return W.schema;
  if (PLATFORM[key]) return W.platform[key] || null;
  if (POLICIES[key]) return W.policies[key] || null;
  return null;
}

   Stan gracza (jedna rozgrywka)

function newRun(me, room) {
  const mods = DIVS[me.div].mods;
  return {
    v: 1, room, run: uid('r'), pid: me.pid, name: me.name, div: me.div, startedAt: new Date().toISOString(),
    q: 0, step: 'event', cap: CFG.cap, capMax: CFG.cap, capNext: 0,
    A: CFG.startA, o: CFG.startO + (mods.startO || 0), rFlag: 0, rTemp: 0, tokMult: mods.tokMult || 1, valMult: 1,
    V: 0, qAdj: 0, hist: [], inits: [], played: {}, skills: {}, flags: {}, granted: {},
    offer: [], eventId: null, eventRes: null, dilemmaId: null, dilemmaCtx: null, choice: null, decisions: [],
    usedDil: {}, usedEv: {}, lessons: [], requestsSent: {}, helped: {}, helpCount: 0,
    incidents: 0, pilotsStarted: 0, prodCount: 0, minML: 99, closedCount: 0,
    contrib: { note: 0, schema: 0, lint: 0, skill: 0, platform: 0, policy: 0, install: 0 },
    lastLesson: null, lastReport: null, final: null
  };
}

function divMods(G) { return DIVS[G.div].mods; }
function ownedSkillCount(G) { return Object.keys(G.skills).length; }
function leverage(G, W) {
  const km = divMods(G).kMult || 1;
  return 1 + CFG.kBonus * W.K * km + CFG.skillBonus * Math.min(ownedSkillCount(G), CFG.skillMax) + (W.platform.mcp ? CFG.mcpBonus : 0);
}
function ochrona(G, W) { return G.o + W.allO; }
function initRisk(it) {
  const c = CARD[it.cid];
  if (it.stage === 'auto') return c.r || 0;
  if (it.stage === 'prod') return c.rProd || 0;
  return c.rP || 0;
}
function ryzyko(G, W) {
  let r = G.rFlag + G.rTemp + (W.debt ? 1 : 0);
  for (const it of G.inits) r += initRisk(it);
  for (const sid in G.skills) if (G.skills[sid] === 'improv') r += 1;
  return Math.max(0, r);
}
function marginLevel(G, W) { const r = ryzyko(G, W); return r <= 0 ? Infinity : ochrona(G, W) / r; }
function incidentChance(ml) { if (ml < 0.5) return 1; if (ml < 1) return (1 - ml) * 0.9; return 0; }
function tokMultTotal(G, W) { return G.tokMult * (W.platform.kalkulator ? 0.85 : 1); }
function adoptionFactor(G) { return 0.4 + 0.6 * G.A; }

function cond(name, G, W) {
  if (PLATFORM[name]) return !!W.platform[name];
  if (name.indexOf('skill:') === 0) return !!G.skills[name.slice(6)];
  switch (name) {
    case 'mlOk': return marginLevel(G, W) >= 1;
    case 'hasProd': return G.inits.some(i => i.stage === 'prod');
    case 'hasPilot': return G.inits.some(i => i.stage === 'pilot' || i.stage === 'it');
    case 'hasTokens': return G.inits.length > 0;
    case 'o3': return ochrona(G, W) >= 3;
    case 'a60': return G.A >= 0.6;
    case 'fresh': return W.staleness <= 3;
    case 'trustLow': return W.trust < 40;
    default: return !!G.flags[name];
  }
}

/* Efekty decyzji i wydarzeń. Zwraca chipy do pokazania i zdarzenia do wysłania. */
function applyFx(G, W, fx, emits) {
  if (!fx) return { chips: [], alt: false };
  if (fx.if) {
    const ok = cond(fx.if, G, W);
    const r = applyFx(G, W, ok ? fx.then : fx.else, emits);
    r.alt = !ok;
    return r;
  }
  const chips = [];
  const chip = (tone, text) => chips.push({ tone, text });
  if (fx.v) { G.qAdj += fx.v; chip(fx.v > 0 ? 'up' : 'down', (fx.v > 0 ? '+' : '−') + Math.abs(fx.v) + ' tys. zł'); }
  if (fx.a) { G.A = clamp(G.A + fx.a, 0.1, 1); chip(fx.a > 0 ? 'up' : 'down', (fx.a > 0 ? '+' : '−') + Math.round(Math.abs(fx.a) * 100) + ' pp adopcji'); }
  if (fx.o) { G.o += fx.o; chip(fx.o > 0 ? 'up' : 'down', (fx.o > 0 ? '+' : '−') + Math.abs(fx.o) + ' do depozytu'); }
  if (fx.r) { G.rFlag = Math.max(-1, G.rFlag + fx.r); chip(fx.r > 0 ? 'down' : 'up', (fx.r > 0 ? '+' : '−') + Math.abs(fx.r) + ' ryzyka na stałe'); }
  if (fx.rTemp) { G.rTemp += fx.rTemp; chip('down', '+' + fx.rTemp + ' ryzyka w tym kwartale'); }
  if (fx.capNext) { G.capNext += fx.capNext; chip(fx.capNext > 0 ? 'up' : 'down', (fx.capNext > 0 ? '+' : '−') + Math.abs(fx.capNext) + ' pkt zespołu w następnym kwartale'); }
  if (fx.cap) { G.cap += fx.cap; chip(fx.cap > 0 ? 'up' : 'down', (fx.cap > 0 ? '+' : '−') + Math.abs(fx.cap) + ' pkt zespołu w tym kwartale'); }
  if (fx.tok) { G.tokMult = round1(G.tokMult * fx.tok * 100) / 100; const pct = Math.round((fx.tok - 1) * 100); chip(pct < 0 ? 'up' : 'down', 'tokeny ' + (pct < 0 ? '−' : '+') + Math.abs(pct) + '%'); }
  if (fx.valMult) { G.valMult *= fx.valMult; chip('down', '−' + Math.round((1 - fx.valMult) * 100) + '% wartości w tym kwartale'); }
  if (fx.note) { for (let i = 0; i < fx.note; i++) emits.push(['note', { text: '', kind: 'auto' }]); G.contrib.note += fx.note; chip('up', '+' + fx.note + ' notatka w Second Brain firmy'); }
  if (fx.lint) { emits.push(['lint', {}]); G.contrib.lint++; chip('up', 'lint Second Brain firmy'); }
  if (fx.trust) { emits.push(['trust', { d: fx.trust }]); chip(fx.trust > 0 ? 'up' : 'down', (fx.trust > 0 ? '+' : '−') + Math.abs(fx.trust) + ' zaufania KNF (cała firma)'); }
  if (fx.flag) {
    G.flags[fx.flag] = true;
    const names = { evals: 'masz zestaw testowy', metryki: 'masz metryki', fallback: 'model zapasowy w bramie', shadow: 'shadow AI w pionie', obietnica: 'obietnica bez pokrycia' };
    chip(fx.flag === 'shadow' || fx.flag === 'obietnica' ? 'down' : 'up', names[fx.flag] || fx.flag);
  }
  if (fx.grant) {
    const c = CARD[fx.grant];
    if (c && !G.played[c.id] && !(c.once && onceDone(W, c.once))) {
      G.granted[c.id] = true;
      if (G.offer && G.offer.indexOf(c.id) < 0) G.offer.push(c.id);
      chip('up', 'karta w portfelu: ' + c.name);
    }
  }
  if (fx.request) {
    const s = SKILLS[fx.request];
    if (s && !W.skills[fx.request] && !G.requestsSent[fx.request]) {
      G.requestsSent[fx.request] = true;
      emits.push(['request', { sid: fx.request }]);
      chip('neutral', 'prośba do pionu ' + DIVS[s.div].short + ': ' + s.title);
    }
  }
  if (fx.help && G.dilemmaCtx) {
    G.helped[G.dilemmaCtx.id] = true; G.helpCount++;
    emits.push(['help', { inc: G.dilemmaCtx.id }]);
    chip('up', '+' + CFG.helpTrust + ' zaufania KNF (cała firma)');
  }
  return { chips, alt: false };
}

/* ---------- wybór wydarzenia, decyzji i oferty ---------- */
function pickEvent(G, W) {
  if (G.q === 0) return EVT.start;
  const rnd = rngFor(G, 'event');
  if (!G.usedEv.kontrola && W.trust < 40) return EVT.kontrola;
  const pool = EVENTS.filter(e => e.fixedQ === undefined && !G.usedEv[e.id] && (!e.when || cond(e.when, G, W)));
  if (!pool.length) return CALM_EVENT;
  return pool[Math.floor(rnd() * pool.length)];
}

function pickDilemma(G, W) {
  const rnd = rngFor(G, 'dilemma');
  if (G.q >= 1) {
    const limit = (G.div === 'ryzyko' || G.div === 'compliance') ? 2 : 1;
    if (G.helpCount < limit) {
      const t0 = Date.parse(G.startedAt) - 60000;
      const fresh = W.incidents.filter(i => i.pid !== G.pid && Date.parse(i.ts) >= t0 && !G.helped[i.id] && !W.helps.some(h => h.pid === G.pid && h.inc === i.id));
      if (fresh.length) {
        const inc = fresh[fresh.length - 1];
        return { d: HELP_DILEMMA, ctx: { id: inc.id, name: inc.name, div: inc.div, title: inc.title } };
      }
    }
  }
  const ok = d => !G.usedDil[d.id] && (!d.when || cond(d.when, G, W));
  if (G.q === 0 && ok(DIL.shadow_ai)) return { d: DIL.shadow_ai };
  const own = DILEMMAS.filter(d => d.div === G.div && ok(d));
  const common = DILEMMAS.filter(d => d.div === '*' && ok(d));
  const pref = (G.q % 2 === 1) ? (own.length ? own : common) : (common.length ? common : own);
  if (!pref.length) return { d: null };
  return { d: pref[Math.floor(rnd() * pref.length)] };
}
function currentDilemma(G) {
  if (G.dilemmaId === 'pomoc') {
    const ctx = G.dilemmaCtx || {};
    const fill = s => s.replace('{div}', DIVS[ctx.div] ? DIVS[ctx.div].short : '').replace('{name}', ctx.name || '').replace('{title}', (ctx.title || '').toLowerCase());
    return Object.assign({}, HELP_DILEMMA, { sit: fill(HELP_DILEMMA.sit) });
  }
  return DIL[G.dilemmaId] || null;
}

function cardCost(G, c) {
  const m = divMods(G);
  let cost = c.cost;
  if (c.type === 'pilot' && m.pilotCost) cost += m.pilotCost;
  if (c.type === 'polityka' && m.policyCost) cost += m.policyCost;
  return Math.max(1, cost);
}
function cardVisible(G, W, c) {
  if (!(c.div === '*' || c.div === G.div || G.granted[c.id])) return false;
  if (!c.repeat && G.played[c.id]) return false;
  if (c.once && onceDone(W, c.once)) return false;
  if (c.type === 'skill' && G.skills[c.sid] === 'own') return false;
  return true;
}

function makeOffer(G, W) {
  const rnd = rngFor(G, 'offer');
  const out = [];
  const vis = id => CARD[id] && cardVisible(G, W, CARD[id]);
  // 1. Second Brain
  let w;
  if (!W.schema && vis('c_schema')) w = 'c_schema';
  else if (W.staleness >= 5 && vis('c_lint')) w = 'c_lint';
  else {
    const divW = CARDS.find(c => c.div === G.div && c.type === 'wiedza' && cardVisible(G, W, c));
    w = divW ? divW.id : (vis('c_decyzje') && rnd() < 0.4 ? 'c_decyzje' : 'c_ingest');
  }
  out.push(w);
  // 2–3. karty pionu: najpierw skille, o które proszą inni
  const reqSids = openRequestsTo(G.div, W).map(r => r.sid);
  const divCards = CARDS.filter(c => c.div === G.div && c.type !== 'wiedza' && cardVisible(G, W, c));
  const requested = divCards.filter(c => c.type === 'skill' && reqSids.indexOf(c.sid) >= 0);
  let rest = shuffle(divCards.filter(c => requested.indexOf(c) < 0), rnd);
  if (G.q <= 1) {
    const sk = rest.filter(c => c.type === 'skill');
    rest = sk.concat(rest.filter(c => c.type !== 'skill'));
  }
  requested.concat(rest).slice(0, 2).forEach(c => out.push(c.id));
  // 4. wspólna karta
  let common = null;
  if (!W.platform.brama && G.q >= 1 && vis('c_brama')) common = 'c_brama';
  else {
    const pool = CARDS.filter(c => c.div === '*' && c.type !== 'wiedza' && cardVisible(G, W, c) && out.indexOf(c.id) < 0);
    if (pool.length) common = pool[Math.floor(rnd() * pool.length)].id;
  }
  if (common) out.push(common);
  // uzupełnij do czterech kart, jeśli pion ma mniej kart
  if (out.length < 4) {
    const extra = shuffle(CARDS.filter(c => (c.div === '*' || c.div === G.div) && cardVisible(G, W, c) && out.indexOf(c.id) < 0 && c.id !== 'c_ingest'), rnd);
    extra.slice(0, 4 - out.length).forEach(c => out.push(c.id));
  }
  Object.keys(G.granted).forEach(id => { if (out.indexOf(id) < 0 && vis(id)) out.push(id); });
  return out;
}

/* ---------- kwartał ---------- */
function startQuarter(G, W, emits) {
  G.step = 'event'; G.qAdj = 0; G.rTemp = 0; G.valMult = 1; G.choice = null; G.lastLesson = null; G.lastReport = null;
  // wejście wdrożeń z kolejki IT na produkcję
  for (const it of G.inits) {
    if (it.stage === 'it') {
      it.stage = 'prod'; G.prodCount++;
      const c = CARD[it.cid];
      if (c.prodTrust) emits.push(['trust', { d: c.prodTrust }]);
    }
  }
  G.cap = CFG.cap + G.capNext + (W.trust < 40 ? -1 : 0);
  G.capNext = 0;
  const ev = pickEvent(G, W);
  G.eventId = ev.id; G.usedEv[ev.id] = true;
  const res = applyFx(G, W, ev.fx, emits);
  G.eventRes = { chips: res.chips, alt: res.alt };
  G.cap = Math.max(1, G.cap);
  G.capMax = G.cap;
  const pick = pickDilemma(G, W);
  G.dilemmaId = pick.d ? pick.d.id : null;
  G.dilemmaCtx = pick.ctx || null;
  if (pick.d && pick.d.id !== 'pomoc') G.usedDil[pick.d.id] = true;
  G.offer = makeOffer(G, W);
  G.granted = {};
  G.offer.forEach(id => { const c = CARD[id]; if (c && c.div !== '*' && c.div !== G.div) G.granted[id] = true; });
}
function currentEvent(G) { return EVT[G.eventId] || CALM_EVENT; }

function choose(G, W, k, emits) {
  if (G.choice) return null;
  const d = currentDilemma(G);
  if (!d) return null;
  const opt = d.opts.find(o => o.k === k);
  if (!opt) return null;
  const res = applyFx(G, W, opt.fx, emits);
  const best = d.opts.find(o => o.best);
  G.choice = { k, alt: res.alt, chips: res.chips, best: !!opt.best, bestK: best ? best.k : null };
  G.decisions.push({ id: d.id, k, best: !!opt.best, title: d.title, lesson: d.lesson });
  return G.choice;
}

/* ---------- karty i pozycje ---------- */
function cardCheck(G, W, c) {
  const reasons = [];
  const cost = cardCost(G, c);
  if (c.once) { const done = onceDone(W, c.once); if (done) reasons.push({ t: 'done', text: 'Już zrobione przez: ' + done.name + ' (' + DIVS[done.div].short + ')' }); }
  if (c.needK && W.K < c.needK) reasons.push({ t: 'k', text: 'Second Brain firmy ma poziom ' + W.K + ', potrzeba ' + c.needK });
  if (c.needPlat && !W.platform[c.needPlat]) reasons.push({ t: 'plat', text: 'Firma nie ma jeszcze: ' + PLATFORM[c.needPlat].name });
  if (c.type === 'skill' && G.skills[c.sid] === 'own') reasons.push({ t: 'have', text: 'Masz już ten skill' });
  if (c.lint && W.staleness < 3) reasons.push({ t: 'lint', text: 'Nie ma jeszcze czego przeglądać: dług wiedzy ' + W.staleness + ' z ' + CFG.staleLimit + ', lint ma sens od 3' });
  if (c.repeat && G.playedQ && G.playedQ[c.id] === G.q) reasons.push({ t: 'once', text: 'Już zagrana w tym kwartale' });
  if (cost > G.cap) reasons.push({ t: 'cap', text: 'Za mało punktów zespołu (potrzeba ' + cost + ')' });
  return { ok: reasons.length === 0, reasons, cost };
}

function playCard(G, W, id, input, emits) {
  const c = CARD[id];
  if (!c || G.offer.indexOf(id) < 0) return null;
  const chk = cardCheck(G, W, c);
  if (!chk.ok) return null;
  G.cap -= chk.cost;
  G.played[id] = (G.played[id] || 0) + 1;
  G.playedQ = G.playedQ || {};
  G.playedQ[id] = G.q;
  const text = str(input, 140);
  switch (c.type) {
    case 'wiedza':
      if (id === 'c_schema') { emits.push(['schema', {}]); G.contrib.schema++; }
      else if (c.note) { for (let i = 0; i < c.note; i++) emits.push(['note', { text: i === 0 ? text : '', kind: c.id === 'o_baza' ? 'baza' : (c.id === 'c_decyzje' ? 'decyzje' : 'ingest') }]); G.contrib.note += c.note; }
      if (c.lint) { emits.push(['lint', {}]); G.contrib.lint++; }
      if (c.o) G.o += c.o;
      break;
    case 'skill': {
      G.skills[c.sid] = 'own';
      emits.push(['skill', { sid: c.sid, rule: text }]);
      G.contrib.skill++;
      break;
    }
    case 'automat': G.inits.push({ cid: id, stage: 'auto', since: G.q }); if (c.flag) G.flags[c.flag] = true; break;
    case 'pilot': G.inits.push({ cid: id, stage: 'pilot', since: G.q }); G.pilotsStarted++; break;
    case 'ochrona': G.o += c.o || 0; if (c.tokMult) G.tokMult = Math.round(G.tokMult * c.tokMult * 100) / 100; if (c.flag) G.flags[c.flag] = true; break;
    case 'ludzie': G.A = clamp(G.A + c.a, 0.1, 1); break;
    case 'platforma': emits.push(['platform', { pid: c.pid }]); G.contrib.platform++; break;
    case 'polityka': emits.push(['policy', { pid: c.pid }]); G.contrib.policy++; break;
  }
  if (!c.repeat) G.offer = G.offer.filter(x => x !== id);
  G.lastLesson = { title: c.name, text: c.lesson, type: c.type };
  addLesson(G, 'card:' + id, c.name, c.lesson);
  return G.lastLesson;
}

function addLesson(G, key, title, text) {
  if (G.lessons.some(l => l.key === key)) return;
  G.lessons.push({ key, title, text, q: G.q });
}

function installCheck(G, W, sid) {
  const s = W.skills[sid];
  if (!s) return { ok: false, text: 'Tego skilla nie ma jeszcze w bibliotece' };
  if (G.skills[sid] === 'own' || G.skills[sid] === 'lib') return { ok: false, text: 'Masz już ten skill' };
  if (CFG.installCost > G.cap) return { ok: false, text: 'Za mało punktów zespołu' };
  return { ok: true };
}
function installSkill(G, W, sid, emits) {
  if (!installCheck(G, W, sid).ok) return null;
  const s = W.skills[sid];
  G.cap -= CFG.installCost;
  G.skills[sid] = 'lib';
  G.contrib.install++;
  emits.push(['install', { sid, author: s.by }]);
  const meta = SKILLS[sid];
  G.lastLesson = { title: 'Instalacja: ' + meta.title + ' v' + s.v + '.0', text: 'Instalujesz skill od pionu ' + DIVS[s.byDiv].short + ' (' + s.byName + '). Autor dostaje wkład, a Ty dźwignię i spełniony warunek wdrożenia. Skill działa u Ciebie dokładnie tak, jak u autora, bo to ten sam plik.', type: 'skill' };
  addLesson(G, 'install', 'Skille z biblioteki', 'Instalacja cudzego skilla kosztuje ułamek jego napisania. Reuse jest źródłem zwrotu ze skilli, a autor dostaje wkład za każdą instalację.');
  return G.lastLesson;
}
function improvSkill(G, W, sid) {
  if (G.skills[sid] || CFG.improvCost > G.cap) return null;
  G.cap -= CFG.improvCost;
  G.skills[sid] = 'improv';
  const meta = SKILLS[sid];
  G.lastLesson = { title: 'Skill bez właściciela: ' + meta.title, text: 'Piszesz cudzy skill sam, bez pionu ' + DIVS[meta.div].short + '. Działa, ale ryzyko rośnie o 1, bo reguł nie sprawdził nikt, kto za nie odpowiada. Gdy właściciel opublikuje swój, zainstaluj go i ryzyko zniknie.', type: 'skill' };
  addLesson(G, 'improv', 'Skill bez właściciela', 'Skill napisany przez pion, który nie odpowiada za jego treść, działa, ale nikt nie pilnuje jego reguł. Właściciel merytoryczny jest częścią skilla.');
  return G.lastLesson;
}
function requestSkill(G, W, sid, emits) {
  if (G.requestsSent[sid] || W.skills[sid] || !SKILLS[sid]) return null;
  G.requestsSent[sid] = true;
  emits.push(['request', { sid }]);
  return true;
}

function deployCheck(G, W, idx) {
  const it = G.inits[idx];
  if (!it || it.stage !== 'pilot') return null;
  const c = CARD[it.cid];
  const reasons = [];
  if (it.since >= G.q) reasons.push('Pilotaż musi potrwać co najmniej jeden pełny kwartał');
  if (!W.platform.brama) reasons.push('Firma nie ma bramy LiteLLM');
  const missing = (c.prodNeeds || []).filter(s => !G.skills[s]);
  const cost = Math.max(1, CFG.deployCost - (W.platform.rejestr ? 1 : 0));
  if (cost > G.cap) reasons.push('Za mało punktów zespołu (potrzeba ' + cost + ')');
  if (W.trust < 60) {
    const rAfter = ryzyko(G, W) + (c.rProd || 0) - (c.rP || 0);
    if (ochrona(G, W) < rAfter) reasons.push('Nadzór wzmożony: po wdrożeniu depozyt musi mieć co najmniej 100%');
  }
  return { ok: !reasons.length && !missing.length, reasons, missing, cost };
}
function deploy(G, W, idx) {
  const chk = deployCheck(G, W, idx);
  if (!chk || !chk.ok) return null;
  const it = G.inits[idx];
  it.stage = 'it'; it.itAt = G.q;
  G.cap -= chk.cost;
  const c = CARD[it.cid];
  G.lastLesson = { title: 'Do IT: ' + c.name, text: 'IT dostaje pakiet: prototyp, specyfikację, pytania otwarte i wycenę. Produkcja to uwierzytelnianie, dane, logi, testy, hosting i zgoda compliance. Wejdzie na produkcję w następnym kwartale.', type: 'pilot' };
  addLesson(G, 'deploy', 'POC a produkcja', 'Prototyp powstaje w godzinę, produkcja wymaga uwierzytelniania, danych, logów, testów, hostingu i zgody compliance. Dlatego wdrożenie trwa kwartał i potrzebuje bramy.');
  return G.lastLesson;
}
function closeInit(G, idx) {
  const it = G.inits[idx];
  if (!it) return null;
  const c = CARD[it.cid];
  G.inits.splice(idx, 1);
  G.closedCount++;
  G.lastLesson = { title: 'Stop-loss: ' + c.name, text: 'Zamykasz pozycję. Znika jej wartość i jej ryzyko. Zamknięcie pilotażu, który nie dowiózł liczby, to decyzja, a nie porażka.', type: 'pilot' };
  addLesson(G, 'close', 'Stop-loss', 'Każdy pilotaż ma z góry ustaloną metrykę i termin. Jeśli nie dowozi, zamykasz pozycję, zanim zje zespół i budżet.');
  return G.lastLesson;
}

/* ---------- rozliczenie ---------- */
function incidentTitle(G, rnd) {
  const cands = G.inits.filter(i => initRisk(i) > 0 && CARD[i.cid].incident).sort((a, b) => initRisk(b) - initRisk(a));
  if (G.flags.shadow && (!cands.length || rnd() < 0.5)) return 'Dane klientów trafiły do prywatnego czatu AI';
  if (cands.length) return CARD[cands[0].cid].incident;
  return 'Narzędzie AI zrobiło coś, czego nikt nie przewidział';
}

function settle(G, W, emits) {
  const D = leverage(G, W), AF = adoptionFactor(G), tm = tokMultTotal(G, W), m = divMods(G);
  const rows = [];
  let gross = 0, cost = 0;
  for (const it of G.inits) {
    const c = CARD[it.cid];
    let val = 0, tok = 0, label = '';
    if (it.stage === 'auto') {
      val = c.base * D * (m.autoMult || 1) * (c.boostSkill && G.skills[c.boostSkill] ? 2 : 1);
      tok = c.tok || 0; label = 'automatyzacja';
    } else if (it.stage === 'prod') {
      val = c.prod * D * AF * (m.prodMult || 1);
      tok = c.tokProd || 0; label = 'produkcja';
    } else {
      const age = G.q - it.since;
      const stale = it.stage === 'pilot' && age >= CFG.staleAfter;
      val = c.base * D * AF * (stale ? 0.5 : 1);
      tok = c.tokP || 0;
      label = it.stage === 'it' ? 'u IT' : (stale ? 'pilotaż bez końca' : 'pilotaż');
    }
    val = round1(val * G.valMult);
    tok = round1(tok * tm);
    gross += val; cost += tok;
    it.lastVal = round1(val - tok);
    rows.push({ cid: it.cid, name: c.name, stage: it.stage, label, val, tok });
  }
  gross = round1(gross); cost = round1(cost);
  const r = ryzyko(G, W), o = ochrona(G, W);
  const ml = r > 0 ? o / r : Infinity;
  const pInc = incidentChance(ml);
  G.minML = Math.min(G.minML, ml === Infinity ? 99 : ml);
  const rnd = rngFor(G, 'incident');
  let inc = null;
  if (pInc > 0 && (pInc >= 1 || rnd() < pInc)) {
    const prodN = G.inits.filter(i => i.stage === 'prod').length;
    const incCost = Math.round((CFG.incidentBase + CFG.incidentPerProd * prodN) * (W.trust < 40 ? 1.5 : 1));
    inc = { stopOut: ml < 0.5, title: incidentTitle(G, rnd), cost: incCost };
    if (inc.stopOut) {
      let worst = -1, wr = 0;
      G.inits.forEach((it, i) => { const ir = initRisk(it); if (ir > wr) { wr = ir; worst = i; } });
      if (worst >= 0) { inc.closed = CARD[G.inits[worst].cid].name; G.inits.splice(worst, 1); }
    }
    G.A = clamp(G.A - 0.08, 0.1, 1);
    G.o += 1;
    G.incidents++;
    emits.push(['incident', { title: inc.title, cost: incCost }]);
    addLesson(G, 'incident', 'Margin call', 'Incydent przychodzi, gdy ryzyko przerasta zabezpieczenia. Post-mortem dodaje brakującą kontrolę, ale to najdroższa droga do niej.');
  }
  const net = round1(gross - cost + G.qAdj - (inc ? inc.cost : 0));
  G.V = round1(G.V + net);
  const rep = { q: G.q, rows, gross, cost, adj: G.qAdj, inc, net, V: G.V, D, AF, ml, pInc, r, o };
  G.hist.push({ q: G.q, net, V: G.V, ml: ml === Infinity ? null : ml, inc: !!inc });
  G.lastReport = rep;
  G.step = 'settle';
  emits.push(['q', { q: G.q + 1, value: G.V }]);
  return rep;
}

function nextQuarter(G, W, emits) {
  if (G.step !== 'settle') return;
  G.q++;
  if (G.q >= QUARTERS.length) { finish(G, W, emits); return; }
  startQuarter(G, W, emits);
}

/* ---------- koniec gry ---------- */
function profileFor(G, W) {
  const me = W.players[G.pid];
  const installsGot = me ? me.c.install : 0;
  const reqDone = me ? me.c.request : 0;
  const found = G.contrib.note + G.contrib.schema + G.contrib.lint + G.contrib.platform + G.contrib.policy;
  const shared = found + G.contrib.skill;
  if (G.incidents >= 2) return 'hazard';
  if (found >= 4 && G.prodCount >= 1 && G.incidents === 0) return 'architekt';
  if (installsGot >= 2 || reqDone >= 1) return 'integrator';
  if (G.prodCount >= 2 && G.incidents === 0) return 'skaler';
  if (G.pilotsStarted >= 3 && G.prodCount === 0) return 'kowboj';
  if (shared === 0) return 'wilk';
  if (G.minML >= 1.5) return 'straznik';
  return 'pragmatyk';
}

function planFor(G, W) {
  const t = [], m = [], o = [];
  const bad = id => G.decisions.some(d => d.id === id && !d.best);
  if (G.contrib.note + G.contrib.schema === 0) t.push(PLAN.tydzien.notes);
  if (!Object.values(G.skills).some(v => v === 'own')) t.push(PLAN.tydzien.skill);
  if (G.flags.shadow || bad('shadow_ai')) t.push(PLAN.tydzien.shadow);
  if (t.length < 2) t.push(PLAN.tydzien.build);
  if (!G.flags.metryki) m.push(PLAN.miesiac.metryki);
  if (G.incidents > 0 || !G.flags.evals) m.push(PLAN.miesiac.evals);
  if (!G.flags.appsscript) m.push(PLAN.miesiac.script);
  if (m.length < 2) m.push(PLAN.miesiac.rejestr);
  Object.keys(G.requestsSent).forEach(sid => {
    const s = SKILLS[sid];
    o.push('Od pionu ' + DIVS[s.div].short + ': skill „' + s.title + '” z właścicielem i wersją.');
  });
  Object.keys(G.skills).forEach(sid => {
    if (G.skills[sid] === 'improv') { const s = SKILLS[sid]; o.push('Od pionu ' + DIVS[s.div].short + ': właściciel merytoryczny skilla „' + s.title + '”.'); }
  });
  if (!W.platform.brama) o.push(PLAN.org.brama);
  if (G.incidents > 0 || W.trust < 60) o.push(PLAN.org.klasy);
  o.push(PLAN.org.owner);
  return { tydzien: t.slice(0, 2), miesiac: m.slice(0, 2), org: o.slice(0, 3) };
}

function finish(G, W, emits) {
  G.step = 'end';
  const profile = profileFor(G, W);
  const stats = { prod: G.prodCount, pilots: G.pilotsStarted, inc: G.incidents, best: G.decisions.filter(d => d.best).length, dec: G.decisions.length };
  G.final = { profile, stats, plan: planFor(G, W) };
  emits.push(['end', { value: G.V, profile, stats }]);
}

    this.savePending();
    this.post(ev);
    return ev;
  },

  all() { return this.remote.concat(this.pending.filter(p => !p._rejected)); }
};

    '<div class="t-cell"><span class="lbl">Wartość netto</span><b class="' + (G.V < 0 ? 'neg' : '') + '">' + money(G.V) + '</b><span class="t-sub">pion ' + esc(DIVS[G.div].short) + '</span></div>' +
    '<div class="t-cell"><span class="lbl">Dźwignia</span><b>×' + nf2.format(D) + '</b><span class="t-sub">Second Brain ' + W.K + '/5 · skille ' + Object.keys(G.skills).length + '</span></div>' +
    '<div class="t-cell"><span class="lbl">Poziom depozytu</span><b>' + (ml === Infinity ? '∞' : nf0.format(ml * 100) + '%') + '</b><div class="gauge ' + cls + '" title="Kreski: 50% (stop out) i 100% (margin call)"><i style="width:' + w + '%"></i><em style="left:25%"></em><em style="left:50%"></em></div><span class="t-sub">ochrona ' + o + ' / ryzyko ' + r + '</span></div>' +
    '<div class="t-cell"><span class="lbl">Adopcja</span><b>' + pct(G.A) + '</b><span class="t-sub">mnożnik ×' + nf2.format(adoptionFactor(G)) + '</span></div>' +
    '<div class="t-cell"><span class="lbl">Zespół</span>' + capDots(ended ? 0 : G.cap, ended ? 0 : G.capMax) + '<span class="t-sub">' + (ended ? 'koniec' : G.cap + ' z ' + G.capMax + ' pkt') + '</span></div>' +
    '</div>' + (ts.key !== 'ok' ? '<div class="term-alert ' + (ts.key === 'kontrola' ? 'bad' : '') + '">' + esc(ts.label) + ' (zaufanie ' + W.trust + '/100): ' + esc(ts.text) + '</div>' : '');
}

function renderTabs() {
  const el = $('#tabs'); if (!el) return;
  const t = [['gra', 'Gra'], ['firma', 'Firma'], ['ranking', 'Ranking']];
  el.innerHTML = t.map(x => '<button role="tab" aria-selected="' + (S.tab === x[0]) + '" data-act="tab" data-t="' + x[0] + '">' + x[1] + '</button>').join('');
  $('#app').dataset.tab = S.tab;
}

function renderMain() {
  const G = S.G, el = $('#main');
  if (!el || !G) return;
  let h = '';
  switch (G.step) {
    case 'event': h = eventHTML(G); break;
    case 'decision': h = decisionHTML(G); break;
    case 'portfolio': h = portfolioHTML(G); break;
    case 'settle': h = settleHTML(G); break;
    case 'end': h = endHTML(G); break;
  }
  el.innerHTML = h;
}

function eventHTML(G) {
  const ev = currentEvent(G);
  const res = G.eventRes || { chips: [], alt: false };
  const out = res.alt && ev.outElse ? ev.outElse : ev.out;
  const next = currentDilemma(G) ? 'Dalej: decyzja' : 'Dalej: portfel inicjatyw';
  return stepperHTML('event') + '<div class="stage"><article class="sheet news">' +
    '<div class="meta"><span class="tag">RYNEK</span><span class="lbl">' + QUARTERS[G.q] + '</span></div>' +
    '<h2>' + esc(ev.title) + '</h2><p class="body">' + esc(ev.text) + '</p>' +
    '<div class="effect"><span class="lbl">Co to znaczy dla Twojego pionu</span><p>' + esc(out) + '</p>' + chipsHTML(res.chips) + '</div>' +
    '</article><div class="stage-actions"><button class="btn btn-primary btn-big" data-act="toDecision">' + next + '</button></div></div>';
}

function decisionHTML(G) {
  const d = currentDilemma(G);
  if (!d) return portfolioHTML(G);
  const ch = G.choice;
  const scope = d.div === '*' ? 'cały zarząd' : DIVS[d.div].name;
  const opts = d.opts.map(o => {
    let cls = 'opt';
    if (ch) { if (o.k === ch.k) cls += ' chosen'; if (o.best) cls += ' best'; }
    return '<button class="' + cls + '" data-act="choose" data-k="' + o.k + '"' + (ch ? ' disabled' : '') + '><span class="k">' + o.k + '</span><span>' + esc(o.label) + '</span></button>';
  }).join('');
  let reveal = '';
  if (ch) {
    const opt = d.opts.find(o => o.k === ch.k);
    const out = ch.alt && opt.outElse ? opt.outElse : opt.out;
    reveal = '<div class="outcome ' + (ch.best ? 'good' : '') + '"><span class="lbl">Skutek</span><p>' + esc(out) + '</p>' + chipsHTML(ch.chips) + '</div>' +
      '<div class="lesson"><span class="lbl">Lekcja</span><p>' + esc(d.lesson) + '</p><p class="verdict">' + (ch.best ? 'Trafiona decyzja.' : 'Najlepszy ruch w tej sytuacji: ' + ch.bestK + '.') + '</p></div>';
  }
  return stepperHTML('decision') + '<div class="stage"><article class="sheet dilemma">' +
    '<div class="meta"><span class="lbl">Decyzja · ' + esc(scope) + '</span></div><h2>' + esc(d.title) + '</h2><p class="body">' + esc(d.sit) + '</p>' +
    '<div class="opts" role="group" aria-label="Opcje">' + opts + '</div>' + reveal + '</article>' +
    (ch ? '<div class="stage-actions"><button class="btn btn-primary btn-big" data-act="toPortfolio">Dalej: portfel inicjatyw</button></div>' : '<p class="lbl" style="text-align:right">Możesz też nacisnąć A, B albo C</p>') +
    '</div>';
}

function cardStats(c, G, W) {
  const out = [];
  const D = leverage(G, W);
  switch (c.type) {
    case 'wiedza':
      if (c.id === 'c_schema') out.push('schemat dla całej firmy: bez niego Second Brain stoi na poziomie 1');
      else if (c.note) out.push('+' + notes(c.note) + ' w Second Brain firmy (poziom teraz ' + W.K + '/5)');
      if (c.lint) out.push('zeruje dług wiedzy firmy (teraz ' + W.staleness + ' z ' + CFG.staleLimit + ')');
      if (c.o) out.push('+' + c.o + ' do depozytu, poziom depozytu ' + mlFmt(mlAfter(G, W, 0, 0)) + ' → ' + mlFmt(mlAfter(G, W, 0, c.o)));
      out.push('wkład dla firmy: ' + money(c.id === 'c_schema' ? CFG.wklad.schema : (c.lint ? CFG.wklad.lint : CFG.wklad.note * (c.note || 1))));
      break;
    case 'skill': {
      const need = [];
      (NEEDED_BY[c.sid] || []).forEach(x => { if (x.div !== G.div && need.indexOf(DIVS[x.div].short) < 0) need.push(DIVS[x.div].short); });
      out.push('dźwignia +' + nf2.format(CFG.skillBonus) + ', skill trafia do biblioteki firmy');
      if (need.length) out.push('do wdrożeń potrzebują go: ' + need.join(', '));
      const im = divMods(G).installMult || 1;
      out.push('wkład ' + money(CFG.wklad.install * im) + ' za każdą instalację przez inny pion');
      break;
    }
    case 'automat': {
      const m = divMods(G).autoMult || 1;
      const boost = c.boostSkill && G.skills[c.boostSkill] ? 2 : 1;
      out.push('ok. ' + money(c.base * D * m * boost) + ' na kwartał przy obecnej dźwigni');
      out.push('tokeny ' + nf1.format(c.tok * tokMultTotal(G, W)) + ' tys. zł na kwartał');
      out.push('nie zależy od adopcji, działa samo');
      break;
    }
    case 'pilot':
      out.push('pilotaż ' + c.base + ' → produkcja ' + c.prod + ' tys. zł na kwartał, razy dźwignia i adopcja');
      out.push('tokeny ' + c.tokP + ' → ' + c.tokProd + ' · ryzyko +' + c.rP + ' → +' + c.rProd);
      { const a = mlAfter(G, W, c.rP, 0); out.push('poziom depozytu po starcie: ' + mlFmt(mlAfter(G, W, 0, 0)) + ' → ' + mlFmt(a) + (a < 1 ? ' (poniżej 100%: groźba margin callu)' : '')); }
      break;
    case 'ochrona':
      out.push('+' + c.o + ' do depozytu, poziom ' + mlFmt(mlAfter(G, W, 0, 0)) + ' → ' + mlFmt(mlAfter(G, W, 0, c.o)));
      if (c.tokMult) out.push('tokeny −' + Math.round((1 - c.tokMult) * 100) + '%');
      if (c.flag === 'fallback') out.push('chroni przed awarią dostawcy');
      if (c.flag === 'evals') out.push('lepsze wyjście z części decyzji');
      break;
    case 'ludzie':
      out.push('+' + Math.round(c.a * 100) + ' pp adopcji (teraz ' + pct(G.A) + ')');
      out.push('adopcja mnoży wartość pilotaży i wdrożeń');
      break;
    case 'platforma':
      out.push('dla całej firmy: ' + PLATFORM[c.pid].effect);
      out.push('wkład dla firmy: ' + money(CFG.wklad.platform));
      break;
    case 'polityka':
      out.push('dla całej firmy: ' + POLICIES[c.pid].effect + (POLICIES[c.pid].allO ? ', u Ciebie ' + mlFmt(mlAfter(G, W, 0, 0)) + ' → ' + mlFmt(mlAfter(G, W, 0, POLICIES[c.pid].allO)) : ''));
      if (POLICIES[c.pid].trust) out.push('+' + POLICIES[c.pid].trust + ' zaufania KNF');
      out.push('wkład dla firmy: ' + money(CFG.wklad.policy));
      break;
  }
  return out.map(s => '<li>' + esc(s) + '</li>').join('');
}

function cardNeeds(c, G, W) {
  if (c.type !== 'pilot') return '';
  const items = ['<span class="need ' + (W.platform.brama ? 'ok' : 'no') + '">Brama ' + (W.platform.brama ? '✓' : '✗') + '</span>'];
  (c.prodNeeds || []).forEach(sid => {
    const has = !!G.skills[sid], inLib = !!W.skills[sid];
    items.push('<span class="need ' + (has ? 'ok' : (inLib ? '' : 'no')) + '">' + esc(SKILLS[sid].title) + ' ' + (has ? '✓' : (inLib ? '· w bibliotece' : '✗')) + '</span>');
  });
  return '<div><span class="lbl">Do wdrożenia na produkcję</span><div class="c-needs">' + items.join('') + '</div></div>';
}

function cardHTML(c, G, W) {
  const chk = cardCheck(G, W, c);
  const reqs = c.type === 'skill' ? openRequestsTo(G.div, W).filter(r => r.sid === c.sid && r.from !== G.pid) : [];
  const badge = reqs.length ? '<span class="req-badge">Prośba: ' + esc(reqs.map(r => r.fromName + ' (' + DIVS[r.fromDiv].short + ')').join(', ')) + '</span>' : '';
  const granted = c.div !== '*' && c.div !== G.div ? '<span class="req-badge">Karta z decyzji</span>' : '';
  const why = chk.reasons.map(r => '<li>' + esc(r.text) + '</li>').join('');
  return '<article class="card t-' + c.type + (chk.ok ? '' : ' is-locked') + '">' +
    '<header class="c-band"><span>' + TYPES[c.type].label + '</span><span>' + chk.cost + ' pkt</span></header>' +
    '<div class="c-body">' + badge + granted + '<h4>' + esc(c.name) + '</h4><p>' + esc(c.text) + '</p>' +
    '<ul class="c-stats">' + cardStats(c, G, W) + '</ul>' + cardNeeds(c, G, W) +
    (why ? '<ul class="c-why">' + why + '</ul>' : '') +
    '<div class="c-foot"><button class="btn ' + (chk.ok ? 'btn-primary' : '') + '" data-act="play" data-id="' + c.id + '"' + (chk.ok ? '' : ' disabled') + '>' + (chk.ok ? 'Zagraj · ' + chk.cost + ' pkt' : 'Niedostępna') + '</button></div>' +
    '</div></article>';
}

function positionsHTML(G, W) {
  if (!G.inits.length) return '<p class="empty">Nie masz jeszcze otwartych pozycji. Pilotaże i automatyzacje z portfela pojawią się tutaj razem z wdrożeniem i stop-lossem.</p>';
  return '<div class="pos-list">' + G.inits.map((it, i) => {
    const c = CARD[it.cid];
    let chip = '', acts = '', why = '';
    if (it.stage === 'auto') chip = '<span class="stagechip">automatyzacja</span>';
    else if (it.stage === 'prod') chip = '<span class="stagechip prod">produkcja</span>';
    else if (it.stage === 'it') chip = '<span class="stagechip it">u IT · produkcja od następnego kwartału</span>';
    else {
      const stale = G.q - it.since >= CFG.staleAfter;
      chip = '<span class="stagechip ' + (stale ? 'stale' : '') + '">' + (stale ? 'pilotaż bez końca' : 'pilotaż') + ' · od ' + QUARTERS[it.since] + '</span>';
      const chk = deployCheck(G, W, i);
      acts += '<button class="btn btn-sm ' + (chk.ok ? 'btn-primary' : '') + '" data-act="deploy" data-i="' + i + '"' + (chk.ok ? '' : ' disabled') + '>Wdróż na produkcję · ' + chk.cost + ' pkt</button>';
      chk.missing.forEach(sid => {
        const s = SKILLS[sid];
        if (W.skills[sid]) {
          acts += '<button class="btn btn-sm" data-act="install" data-sid="' + sid + '"' + (installCheck(G, W, sid).ok ? '' : ' disabled') + '>Zainstaluj „' + esc(s.title) + '” · 1 pkt</button>';
        } else if (s.div === G.div) {
          acts += '<span class="chip">Brakuje Twojego skilla „' + esc(s.title) + '”: karta pojawi się w portfelu</span>';
        } else {
          acts += G.requestsSent[sid]
            ? '<span class="chip">Prośba do pionu ' + esc(DIVS[s.div].short) + ' wysłana</span>'
            : '<button class="btn btn-sm" data-act="request" data-sid="' + sid + '">Poproś pion ' + esc(DIVS[s.div].short) + ' o „' + esc(s.title) + '”</button>';
          acts += '<button class="btn btn-sm" data-act="improv" data-sid="' + sid + '"' + (G.cap >= CFG.improvCost ? '' : ' disabled') + '>Napisz sam, bez właściciela · ' + CFG.improvCost + ' pkt</button>';
        }
      });
      if (chk.reasons.length) why = '<div class="pos-why">' + chk.reasons.map(esc).join(' · ') + '</div>';
      acts += S.confirmClose === i
        ? '<button class="btn btn-sm btn-warn" data-act="close" data-i="' + i + '">Na pewno zamknąć?</button>'
        : '<button class="btn btn-sm btn-ghost" data-act="askClose" data-i="' + i + '">Stop-loss: zamknij</button>';
    }
    const last = it.lastVal != null ? 'ostatni kwartał: ' + signed(it.lastVal) : 'jeszcze bez rozliczenia';
    const after = it.stage === 'pilot' ? '<span>po wdrożeniu: produkcja ' + c.prod + ' tys. zł/kw., poziom depozytu ' + mlFmt(mlAfter(G, W, (c.rProd || 0) - (c.rP || 0), 0)) + '</span>' : '';
    return '<div class="pos t-' + c.type + '"><div class="pos-top"><b>' + esc(c.name) + '</b>' + chip + '</div>' +
      '<div class="pos-meta"><span>' + last + '</span><span>ryzyko +' + initRisk(it) + '</span>' + after + '</div>' + why +
      (acts ? '<div class="pos-actions">' + acts + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

function libraryHTML(G, W) {
  const list = Object.values(W.skills);
  if (!list.length) return '<p class="empty">Biblioteka jest pusta. Pierwszy opublikowany skill trafi tutaj i każdy pion będzie mógł go zainstalować za 1 punkt.</p>';
  return '<div class="lib-list">' + list.map(s => {
    const m = SKILLS[s.sid], mine = G.skills[s.sid];
    const chk = installCheck(G, W, s.sid);
    const btn = mine === 'own' ? '<span class="chip up">Twój skill</span>'
      : (mine === 'lib' ? '<span class="chip up">Zainstalowany</span>'
        : '<button class="btn btn-sm ' + (chk.ok ? 'btn-primary' : '') + '" data-act="install" data-sid="' + s.sid + '"' + (chk.ok ? '' : ' disabled') + '>Zainstaluj · 1 pkt</button>');
    return '<div class="lib-item"><div><b>' + esc(m.title) + ' <span class="mono">v' + s.v + '.0</span></b><small>' + divChip(s.byDiv) + ' ' + esc(s.byName) + ' · instalacje: ' + s.installs + (mine === 'improv' ? ' · masz wersję bez właściciela, instalacja zdejmie ryzyko' : '') + '</small></div>' +
      '<div class="acts"><button class="btn btn-sm btn-ghost" data-act="viewSkill" data-sid="' + s.sid + '">SKILL.md</button>' + btn + '</div></div>';
  }).join('') + '</div>';
}

  const W = S.W;
  const lesson = G.lastLesson ? '<div class="callout" role="status"><span class="lbl">Lekcja · ' + esc(G.lastLesson.title) + '</span><p>' + esc(G.lastLesson.text) + '</p></div>' : '';

    '<section class="sheet block"><h3>Biblioteka skilli firmy <span class="lbl">instalacja: 1 pkt</span></h3>' + libraryHTML(G, W) + '</section>' +
    '<div class="stage-actions"><button class="btn btn-primary btn-big" data-act="endQuarter">Zamknij kwartał ' + QUARTERS[G.q] + (G.cap > 0 ? ' (zostaje ' + G.cap + ' pkt)' : '') + '</button></div>' +

  const pTxt = R.pInc >= 1 ? 'Poniżej 50% to stop out: incydent jest pewny.' : (R.pInc > 0 ? 'Poniżej 100% możesz dostać margin call. Szansa w tym kwartale: ' + nf0.format(R.pInc * 100) + '%.' : 'Powyżej 100%: w tym kwartale incydent Ci nie groził.');
  return stepperHTML('settle') + '<div class="stage"><article class="sheet">' +
    '<span class="lbl">Rozliczenie · tabela w tys. zł</span><h2>' + QUARTERS[G.q] + '</h2>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pozycja</th><th class="r">Wartość</th><th class="r">Tokeny</th><th class="r">Netto</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="4" class="empty">Brak otwartych pozycji w tym kwartale.</td></tr>') +
    (R.adj ? '<tr><td>Decyzje i wydarzenia</td><td></td><td></td><td class="num r ' + (R.adj >= 0 ? 'pos-v' : 'neg-v') + '">' + nf1.format(R.adj) + '</td></tr>' : '') +
    (R.inc ? '<tr><td>Incydent</td><td></td><td></td><td class="num r neg-v">' + nf1.format(-R.inc.cost) + '</td></tr>' : '') +
    '<tr class="total"><td>Razem</td><td class="num r">' + nf1.format(R.gross) + '</td><td class="num r">' + nf1.format(R.cost) + '</td><td class="num r">' + nf1.format(R.net) + '</td></tr>' +
    '</tbody></table></div>' +
    '<div class="margin-box"><div class="ml-big ' + mlCls + '">' + mlv + '</div><div><b>Poziom depozytu</b> = ochrona ' + R.o + ' / ryzyko ' + R.r + '. ' + pTxt + '<br><span class="lbl">dźwignia ×' + nf2.format(R.D) + ' · mnożnik adopcji ×' + nf2.format(R.AF) + '</span></div></div>' +
    (R.inc ? '<div class="incident"><span class="lbl">' + (R.inc.stopOut ? 'Stop out' : 'Margin call') + '</span><b>' + esc(R.inc.title) + '</b><p>Koszt ' + money(R.inc.cost) + ', adopcja −8 pp, zaufanie KNF całej firmy −8. Post-mortem dał Ci +1 do depozytu.' + (R.inc.closed ? ' Zamknięta pozycja: ' + esc(R.inc.closed) + '.' : '') + '</p></div>' : '') +
    '<div class="net-line"><span class="lbl">Wynik kwartału</span><b class="' + (R.net >= 0 ? 'pos-v' : 'neg-v') + '">' + signed(R.net) + '</b></div>' +
    '</article><div class="stage-actions"><button class="btn btn-primary btn-big" data-act="nextQuarter">' + (G.q >= 7 ? 'Zobacz wynik końcowy' : 'Następny kwartał: ' + QUARTERS[G.q + 1]) + '</button></div></div>';
}

function sparkSVG(G) {
  const pts = [{ x: 0, v: 0, inc: false }].concat(G.hist.map((h, i) => ({ x: i + 1, v: h.V, inc: h.inc })));
  const Wd = 640, Ht = 190, pl = 96, pr = 16, pt = 30, pb = 26;
  let mn = Math.min(0, ...pts.map(p => p.v)), mx = Math.max(0, ...pts.map(p => p.v));
  if (mx - mn < 1) mx = mn + 1;
  const X = x => pl + (Wd - pl - pr) * x / 8;
  const Y = v => pt + (Ht - pt - pb) * (1 - (v - mn) / (mx - mn));
  const line = pts.map(p => X(p.x).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ');
  const area = 'M' + X(0) + ',' + Y(0) + ' L' + line.replace(/ /g, ' L') + ' L' + X(pts[pts.length - 1].x) + ',' + Y(0) + ' Z';

function skillMd(sid, W, extra) {
  const m = SKILLS[sid], s = W.skills[sid];
  const v = extra ? (s ? s.v + 1 : 1) : (s ? s.v : 1);
  const owner = extra ? extra.owner : (s ? DIVS[s.byDiv].name + ' · ' + s.byName : DIVS[m.div].name);
  const rules = m.rules.slice();
  if (s) s.rules.forEach(r => rules.push(r.text + ' (' + r.by + ')'));
  if (extra && extra.rule) rules.push(extra.rule + ' (' + extra.by + ')');
  return '---\nname: ' + m.slug + '\ndescription: ' + m.when + '\n---\n\n# ' + m.title + '\n\nWłaściciel: ' + owner + '\nWersja: ' + v + '.0\n\n## Jak użyć\n' + m.when + '\n\n## Reguły\n' + rules.map(r => '- ' + r).join('\n') + '\n';
}
