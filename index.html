  if (!skills.length) md += '\n(brak opublikowanych skilli)\n';
  skills.forEach(s => { md += '\n### ' + SKILLS[s.sid].title + ' (v' + s.v + '.0, instalacje: ' + s.installs + ')\n\n```markdown\n' + skillMd(s.sid, W) + '```\n'; });
  md += '\n## Incydenty\n\n' + (W.incidents.length ? W.incidents.map(i => '- [' + DIVS[i.div].short + ', ' + i.name + '] ' + i.title).join('\n') : '(brak)') + '\n';
  return md;
}

/* ============================================================
   Akcje
   ============================================================ */
const ACT = {
  async unlock() {
    const inp = $('#g-pass');
    const p = normPass(inp && inp.value);
    if (!p) { renderGate('Wpisz hasło od prowadzącego.'); return; }
    const btn = document.querySelector('[data-act="unlock"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Sprawdzam…'; }
    const k = await sha256hex('dzwignia|' + p);
    let ok = null;
    try { ok = await NET.checkKey(k); } catch (e) { ok = null; }
    if (ok === false) { renderGate('To nie to hasło. Zapytaj prowadzącego.'); return; }
    S.key = k; NET.accessKey = k; LS.set('dzw_key', k);
    S.keyUnverified = ok === null;
    if (ok === null) toast('Brak połączenia z bazą. Grasz lokalnie, ranking wróci po połączeniu.');
    S.view = S.pendingView || 'start';
    setHash(roomHash(S.view));
    refold(); render(); tick();
  },
  pickDiv(d, b) {
    S.pickDiv = d.div;
    document.querySelectorAll('.divpick').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.div === d.div)));
  },
  startGame() {
    const input = $('#f-name');
    const name = (input ? input.value : '').replace(/\s+/g, ' ').trim().slice(0, 32);
    if (!S.pickDiv) { toast('Wybierz swój pion'); return; }
    if (!name) { toast('Wpisz imię albo inicjały'); if (input) input.focus(); return; }
    if (S.G && S.G.step !== 'end' && S.G.pid === S.me.pid && !S.forceNew) {
      openModal('<h3>Zacząć od nowa?</h3><p>Masz niedokończoną grę (' + esc(DIVS[S.G.div].short) + ', ' + QUARTERS[Math.min(S.G.q, 7)] + '). Nowa gra ją zastąpi. W rankingu zostanie Twój najlepszy wynik.</p><div class="m-actions"><button class="btn" data-act="resume">Wróć do starej</button><button class="btn btn-primary" data-act="confirmNew">Nowa gra</button></div>');
      return;
    }
    S.forceNew = false;
    S.me.name = name; S.me.div = S.pickDiv; LS.set('dzw_me', S.me);
    S.G = newRun(S.me, S.room);
    const em = [['start', {}]];
    flush(em);
    startQuarter(S.G, S.W, em); flush(em);
    save();
    S.view = 'game'; S.tab = 'gra'; setHash(roomHash('game'));
    render(); window.scrollTo(0, 0);
  },
  confirmNew() { closeModal(); S.forceNew = true; ACT.startGame(); },
  resume() { closeModal(); if (!S.G) return; S.view = 'game'; S.tab = 'gra'; render(); window.scrollTo(0, 0); },
  again() { S.view = 'start'; S.pickDiv = S.G ? S.G.div : S.pickDiv; setHash(roomHash('start')); render(); window.scrollTo(0, 0); },
  goBoard() { closeModal(); S.view = 'board'; setHash(roomHash('board')); render(); window.scrollTo(0, 0); },
  goStart() { S.view = S.G && S.G.step !== 'end' ? 'game' : 'start'; setHash(roomHash('start')); render(); window.scrollTo(0, 0); },
  how() { openModal(HOW_HTML); },
  about() { openModal(ABOUT_HTML); },
  ranking() { openModal('<h3>Ranking · pokój ' + esc(S.room) + '</h3><p class="m-note">Wynik to wartość pionu z najlepszej gry gracza plus wkład dla firmy: notatki, schemat, lint, skille zainstalowane przez innych, spełnione prośby, platforma, polityki i pomoc po incydentach.</p>' + fullRankTable(S.W) + '<div class="m-actions"><button class="btn btn-primary" data-act="closeModal">Zamknij</button></div>', true); },
  roomModal() {
    openModal('<h3>Pokój</h3><p>Każdy pokój to osobna firma z własnym rankingiem. Zmień pokój, gdy chcesz zagrać z inną grupą.</p><input id="m-room" maxlength="40" value="' + esc(S.room) + '" autocomplete="off"><p class="m-note">Małe litery, cyfry i myślniki. Link z pokojem ma końcówkę #r-nazwa.</p><div class="m-actions"><button class="btn" data-act="closeModal">Anuluj</button><button class="btn btn-primary" data-act="saveRoom">Przejdź</button></div>');
  },
  saveRoom() {
    const v = String(($('#m-room') || {}).value || '').toLowerCase().replace(/[^a-z0-9_.~-]/g, '').slice(0, 40) || CFG.defaultRoom;
    closeModal();
    switchRoom(v);
  },
  tab(d) { S.tab = d.t; renderTabs(); window.scrollTo(0, 0); },
  toDecision() {
    const G = S.G; if (!G || G.step !== 'event') return;
    G.step = currentDilemma(G) ? 'decision' : 'portfolio';
    save(); renderMain(); scrollMain();
  },
  choose(d) {
    const G = S.G; if (!G || G.step !== 'decision' || G.choice) return;
    const em = []; choose(G, S.W, d.k, em); flush(em); save();
    renderTerm(); renderMain(); renderSide();
  },
  toPortfolio() {
    const G = S.G; if (!G || G.step !== 'decision' || !G.choice) return;
    G.step = 'portfolio'; G.lastLesson = null; S.confirmClose = null; save(); renderMain(); scrollMain();
  },
  play(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    const c = CARD[d.id]; if (!c) return;
    if (c.type === 'skill') {
      const W = S.W;
      S.modalData = { id: c.id };
      openModal('<h3>Publikujesz skill w bibliotece firmy</h3><p>Tak wygląda plik SKILL.md, który trafi do wspólnej biblioteki. Każdy pion może go zainstalować, a Ty dostajesz wkład za każdą instalację.</p>' +
        '<pre class="skillmd">' + esc(skillMd(c.sid, W, { owner: DIVS[G.div].name + ' · ' + G.name })) + '</pre>' +
        '<label class="lbl" for="m-text">Dopisz jedną regułę od siebie (opcjonalnie)</label><input id="m-text" maxlength="140" autocomplete="off" placeholder="' + esc(RULE_HINT[c.sid] || '') + '">' +
        '<p class="m-note">Reguła trafi do biblioteki i zobaczą ją wszyscy gracze w pokoju. Bez danych poufnych.</p>' +
        '<div class="m-actions"><button class="btn" data-act="closeModal">Anuluj</button><button class="btn btn-primary" data-act="confirmPlay">Opublikuj · ' + cardCost(G, c) + ' pkt</button></div>');
      return;
    }
    if (c.input === 'note') {
      S.modalData = { id: c.id };
      openModal('<h3>Co wrzucasz do Second Brain firmy?</h3><p>Jedna rzecz, której model nie wie o Twoim pionie, a powinien.</p>' +
        '<textarea id="m-text" maxlength="140" rows="3" placeholder="np. definicja aktywnego klienta, skrót, którego używamy, gdzie leży aktualny cennik"></textarea>' +
        '<p class="m-note">Bez danych poufnych i danych klientów. Widzą to wszyscy gracze w pokoju. Możesz zostawić puste.</p>' +
        '<div class="m-actions"><button class="btn" data-act="closeModal">Anuluj</button><button class="btn btn-primary" data-act="confirmPlay">Dodaj · ' + cardCost(G, c) + ' pkt</button></div>');
      return;
    }
    doPlay(c.id, '');
  },
  confirmPlay() {
    const md = S.modalData; if (!md) return;
    const el = $('#m-text');
    const text = el ? el.value : '';
    closeModal();
    doPlay(md.id, text);
  },
  install(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    const em = []; const r = installSkill(G, S.W, d.sid, em); flush(em); save();
    if (r) toast('Zainstalowano: ' + SKILLS[d.sid].title);
    renderAllGame();
  },
  improv(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    improvSkill(G, S.W, d.sid); save(); renderAllGame();
  },
  request(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    const em = []; const r = requestSkill(G, S.W, d.sid, em); flush(em); save();
    if (r) toast('Prośba wysłana do pionu ' + DIVS[SKILLS[d.sid].div].short);
    renderAllGame();
  },
  deploy(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    const r = deploy(G, S.W, +d.i); save();
    if (r) toast('Pakiet poszedł do IT');
    renderAllGame();
  },
  askClose(d) { S.confirmClose = +d.i; renderMain(); },
  close(d) {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    closeInit(G, +d.i); S.confirmClose = null; save(); renderAllGame();
  },
  endQuarter() {
    const G = S.G; if (!G || G.step !== 'portfolio') return;
    const em = []; settle(G, S.W, em); flush(em); save(); S.confirmClose = null;
    renderAllGame(); scrollMain();
  },
  nextQuarter() {
    const G = S.G; if (!G || G.step !== 'settle') return;
    const em = []; nextQuarter(G, S.W, em); flush(em); save();
    renderAllGame(); scrollMain();
  },
  viewSkill(d) {
    const s = S.W.skills[d.sid]; if (!s) return;
    openModal('<h3>' + esc(SKILLS[d.sid].title) + '</h3><p class="m-note">Wersja ' + s.v + '.0 · ' + esc(s.byName) + ' (' + esc(DIVS[s.byDiv].short) + ') · instalacje: ' + s.installs + '</p><pre class="skillmd">' + esc(skillMd(d.sid, S.W)) + '</pre><div class="m-actions"><button class="btn" data-act="copySkill" data-sid="' + d.sid + '">Kopiuj SKILL.md</button><button class="btn btn-primary" data-act="closeModal">Zamknij</button></div>');
  },
  copySkill(d) { copyText(skillMd(d.sid, S.W), 'Skopiowano SKILL.md'); },
  copyLink() { copyText(gameUrl(), 'Skopiowano link'); },
  copyPlan() {
    const G = S.G; if (!G || !G.final) return;
    const p = G.final.plan;
    const t = 'Mój plan po grze Dźwignia AI (' + DIVS[G.div].name + ')\n\nTen tydzień:\n' + p.tydzien.map(x => '- ' + x).join('\n') + '\n\nTen miesiąc:\n' + p.miesiac.map(x => '- ' + x).join('\n') + '\n\nCzego potrzebuję od organizacji:\n' + p.org.map(x => '- ' + x).join('\n');
    copyText(t, 'Skopiowano plan');
  },
  export() {
    const md = exportMarkdown(S.W);
    openModal('<h3>Eksport do Second Brain</h3><p>Notatki i skille, które zarząd zapisał w grze, w formacie Markdown. Wklej do folderu Second Brain albo do Claude’a.</p><textarea class="export" id="m-export" readonly>' + esc(md) + '</textarea><div class="m-actions"><button class="btn" data-act="closeModal">Zamknij</button><button class="btn btn-primary" data-act="copyExport">Kopiuj</button></div>', true);
  },
  copyExport() { copyText(exportMarkdown(S.W), 'Skopiowano eksport'); },
  closeModal() { closeModal(); }
};

function doPlay(id, text) {
  const G = S.G; if (!G || G.step !== 'portfolio') return;
  const em = []; const r = playCard(G, S.W, id, text, em); flush(em); save();
  if (!r) toast('Tej karty nie da się teraz zagrać');
  renderAllGame();
  const m = $('#main .callout'); if (m && m.scrollIntoView) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function renderAllGame() { renderTerm(); renderMain(); renderSide(); }
function scrollMain() { if (window.innerWidth <= 960) window.scrollTo(0, 0); else { const m = $('#main'); if (m && m.getBoundingClientRect().top < 0) window.scrollTo(0, 0); } }

function switchRoom(room) {
  if (room === S.room) return;
  S.room = room;
  NET.setRoom(room);
  const saved = LS.get('dzw_run_' + room);
  S.G = saved && saved.pid === S.me.pid && saved.v === 1 ? saved : null;
  refold();
  S.view = S.view === 'board' ? 'board' : 'start';
  setHash(roomHash(S.view));
  render();
  tick();
}

function render() {
  const app = $('#app');
  app.dataset.view = S.view;
  if (S.view === 'gate') renderGate();
  else if (S.view === 'board') renderBoard();
  else if (S.view === 'game' && S.G) renderGame();
  else { S.view = 'start'; renderStart(); }
}

function sig() {
  const W = S.W, G = S.G;
  return [W.K, Object.keys(W.platform).join(), Object.keys(W.policies).join(), Object.values(W.skills).map(s => s.sid + s.v + ':' + s.installs).join(), W.trust < 40 ? 0 : (W.trust < 60 ? 1 : 2), !!W.schema, W.staleness >= 5, G ? openRequestsTo(G.div, W).length : 0, W.evCount].join('|');
}
function liveUpdate() {
  if (S.view === 'gate') return;
  if (S.view === 'start') { const l = $('#live'); if (l) l.innerHTML = liveHTML(S.W); return; }
  if (S.view === 'board') { renderBoard(); return; }
  if (S.view === 'game' && S.G) {
    renderTerm(); renderSide();
    const s = sig();
    if (s !== S.sig && (S.G.step === 'portfolio' || S.G.step === 'end') && $('#modal').hidden) {
      const y = window.scrollY; renderMain(); window.scrollTo(0, y);
    }
    S.sig = s;
  }
}
function updateBadges() {
  document.querySelectorAll('.net-st').forEach(el => { el.outerHTML = netBadge(); });
}

let lastStatus = null;
async function tick() {
  if (document.hidden) return;
  if (S.keyUnverified && S.key) {
    try { const ok = await NET.checkKey(S.key); S.keyUnverified = false; if (!ok) { lockOut('Hasło się nie zgadza. Wpisz hasło od prowadzącego.'); return; } } catch (e) { }
  }
  const changed = await NET.poll();
  if (changed) { refold(); liveUpdate(); }
  else if (NET.status !== lastStatus) updateBadges();
  lastStatus = NET.status;
}

function boot() {
  const h = parseHash();
  S.room = h.room; S.view = h.view;
  S.me = loadMe(); S.pickDiv = S.me.div || null;
  S.artifact = !!(window.claude && typeof window.claude.use === 'function');
  if (S.artifact) NET.disabled = true;
  S.key = LS.get('dzw_key');
  if (S.key) NET.accessKey = S.key;
  NET.onAuthFail = () => lockOut('Hasło się zmieniło. Wpisz nowe od prowadzącego.');
  if (!S.artifact && !S.key) { S.pendingView = S.view; S.view = 'gate'; }
  NET.setRoom(S.room);
  refold();
  const saved = LS.get('dzw_run_' + S.room);
  if (saved && saved.pid === S.me.pid && saved.v === 1 && DIVS[saved.div]) S.G = saved;
  render();
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b.dataset, b); }
  });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'g-pass') { ACT.unlock(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'f-name') { ACT.startGame(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'm-room') { ACT.saveRoom(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'm-text' && e.target.tagName === 'INPUT') { ACT.confirmPlay(); return; }
    if (S.view === 'game' && S.G && S.G.step === 'decision' && !S.G.choice && $('#modal').hidden && !e.metaKey && !e.ctrlKey && !e.altKey) {
      const k = String(e.key || '').toUpperCase();
      const d = currentDilemma(S.G);
      if (d && d.opts.some(o => o.k === k) && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) ACT.choose({ k });
    }
  });
  window.addEventListener('hashchange', () => {
    const hh = parseHash();
    if (S.view === 'gate') { S.pendingView = hh.view; if (hh.room !== S.room) { S.room = hh.room; NET.setRoom(S.room); } return; }
    if (hh.room !== S.room) { switchRoom(hh.room); return; }
    if (hh.view !== S.view && !(hh.view === 'start' && S.view === 'game')) { S.view = hh.view; render(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  tick();
  setInterval(tick, S.view === 'board' ? 3000 : 4000);
}
boot();

</script>
</body>
</html>
